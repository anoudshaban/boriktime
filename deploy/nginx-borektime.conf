# ---- Börek Time menu (borektime.com) -----------------------------------------
# Proxies to the borektime-app container. The upstream is resolved per request
# through Docker's DNS, so this nginx still starts if that container is down.
# www.borektime.com and the old borektime.codak-tech.com (printed QR codes)
# redirect to https://borektime.com.
server {
    listen 80;
    listen [::]:80;
    server_name borektime.com www.borektime.com borektime.codak-tech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://borektime.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.borektime.com;

    ssl_certificate     /etc/letsencrypt/live/borektime.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/borektime.com/privkey.pem;

    return 301 https://borektime.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name borektime.codak-tech.com;

    ssl_certificate     /etc/letsencrypt/live/borektime.codak-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/borektime.codak-tech.com/privkey.pem;

    return 301 https://borektime.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name borektime.com;

    ssl_certificate     /etc/letsencrypt/live/borektime.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/borektime.com/privkey.pem;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $borektime_upstream http://borektime-app:8080;
        client_max_body_size 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $borektime_upstream;
    }
}
# ---- end Börek Time ------------------------------------------------------------
