
# ---- Börek Time menu (borektime.codak-tech.com) -------------------------------
# Proxies to the borektime-app container. The upstream is resolved per request
# through Docker's DNS, so this nginx still starts if that container is down.
server {
    listen 80;
    listen [::]:80;
    server_name borektime.codak-tech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $borektime_upstream http://borektime-app:8080;
        client_max_body_size 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $borektime_upstream;
    }
}
# ---- end Börek Time ------------------------------------------------------------
